apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "terraria-server.fullname" . }}
  labels:
    {{- include "terraria-server.labels" . | nindent 4 }}
spec:
  strategy:
      type: Recreate
  replicas: 1
  selector:
    matchLabels:
      {{- include "terraria-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "terraria-server.selectorLabels" . | nindent 8 }}
      {{- $files := include "terraria-server.configFiles" . | fromYaml }}
      {{- if $files }}
      annotations:
        checksum/config: {{ $files | toYaml | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # Seed or manage files on the config volume. With values-provided config the files are
        # (over)written on every start; otherwise the image default serverconfig.txt is copied
        # only if the volume has none yet (TShock generates its own config).
        - name: config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              {{- $files := include "terraria-server.configFiles" . | fromYaml }}
              {{- range $name, $_ := $files }}
              cp /values-config/{{ $name }} /config/{{ $name }} && echo "wrote {{ $name }} from values"
              {{- end }}
              if [ ! -f /config/serverconfig.txt ] && [ -f /terraria/config/serverconfig.txt ]; then
                cp /terraria/config/serverconfig.txt /config/serverconfig.txt && echo "seeded default serverconfig.txt"
              fi
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: terraria-config
              mountPath: /config
            {{- if $files }}
            - name: values-config
              mountPath: /values-config
              readOnly: true
            {{- end }}
      {{- if .Values.persistence.world.enabled }}
        - name: set-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 999:999 /terraria/.local/share/Terraria/Worlds && chmod -R 770 /terraria/.local/share/Terraria/Worlds"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: terraria-world
              mountPath: /terraria/.local/share/Terraria/Worlds
      {{- end }}
      containers:
        - name: terraria
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: terraria
              containerPort: {{ .Values.terraria.port }}
              protocol: TCP
          env:
            - name: WORLD_FILENAME
              value: "{{ .Values.terraria.world }}"
            {{- if .Values.terraria.waitForWorld }}
            - name: WAIT_FOR_WORLD
              value: "true"
            {{- end }}
            {{- if .Values.terraria.autocreate }}
            - name: AUTOCREATE
              value: "{{ .Values.terraria.autocreate }}"
            - name: DIFFICULTY
              value: "{{ .Values.terraria.difficulty }}"
            {{- if .Values.terraria.seed }}
            - name: SEED
              value: "{{ .Values.terraria.seed }}"
            {{- end }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: terraria-world
              mountPath: /terraria/.local/share/Terraria/Worlds
            - name: terraria-config
              mountPath: /terraria/config
            - name: terraria-logs
              mountPath: /terraria/logs
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      # Disabled persistence falls back to emptyDir: data is lost when the pod is recreated
      # (NOTES.txt warns loudly about this on install and upgrade).
      volumes:
        - name: terraria-world
        {{- if .Values.persistence.world.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "terraria-server.fullname" . }}-world
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: terraria-config
        {{- if .Values.persistence.config.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "terraria-server.fullname" . }}-config
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: terraria-logs
        {{- if .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "terraria-server.fullname" . }}-logs
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- if include "terraria-server.configFiles" . | fromYaml }}
        - name: values-config
          configMap:
            name: {{ include "terraria-server.fullname" . }}-config
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}