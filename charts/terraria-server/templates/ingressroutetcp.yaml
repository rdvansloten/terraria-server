{{- if .Values.ingress.traefik.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "terraria-server.fullname" . }}
  labels:
    {{- include "terraria-server.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.ingress.traefik.entryPoint }}
  routes:
  - match: HostSNI(`*`)
    services:
    - name: {{ include "terraria-server.fullname" . }}
      port: {{ .Values.ingress.traefik.port }}
{{- end }}
