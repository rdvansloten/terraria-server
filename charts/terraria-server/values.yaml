# Default values for terraria-server
image:
  repository: docker.io/rdvansloten/terraria-server
  # Vanilla Terraria server (the default)
  # renovate: datasource=custom.terraria-server depName=terraria-server versioning=loose
  tag: "1458"
  # To run TShock instead, comment out the tag: above and use the one below. 
  # Then configure the server through tshock.config rather than terraria.config.
  # renovate: datasource=github-releases depName=Pryaxis/TShock versioning=semver-coerced
  # tag: "6.1.0-tshock"
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Terraria server configuration.
terraria:
  # World file name inside the world volume
  world: "Terraria.wld"
  # Container port the server listens on
  port: 7777
  # Generate a world when none exists: 1 = small, 2 = medium, 3 = large. Empty disables it.
  autocreate: 2
  # Seed for the generated world (optional)
  seed: ""
  # Difficulty of the generated world: 0 = Classic, 1 = Expert, 2 = Master, 3 = Journey
  difficulty: 0
  # Instead of generating a world, keep the pod waiting until a world file is copied in.
  # The install notes print the kubectl cp command. Safe to leave on: once the world is on the
  # volume the server starts normally.
  waitForWorld: false
  # Contents of serverconfig.txt (vanilla image). When set, the file is written to the config
  # volume on every start, so changes here win over edits made on the volume. When empty, the
  # image default is seeded once if the volume has no serverconfig.txt yet.
  # Example with every option Terraria's serverconfig.txt supports for a typical server:
  # config: |
  #   # Max number of players allowed on the server, 1 to 255
  #   maxplayers=8
  #   # Port the server listens on (keep in sync with terraria.port)
  #   port=7777
  #   # Password required to join; leave empty for none
  #   password=changeme
  #   # Message of the day
  #   motd=Welcome to Terraria!
  #   # Ban list, relative to the server working directory
  #   banlist=banlist.txt
  #   # Additional cheat protection
  #   secure=1
  #   # Server language code
  #   language=en-US
  config: ""

# TShock image only (image.tag: <version>-tshock). Same semantics as terraria.config: when set, the
# file is written to the config volume on every start. Leave empty to let TShock generate and
# manage its own config.json / sscconfig.json.
tshock:
  # Contents of config.json
  config: ""
  # Contents of sscconfig.json (server side characters)
  sscConfig: ""

# Storage for world data, config, and logs.
# Disabling any of these backs the path with an emptyDir that is wiped whenever the pod is
# recreated, including on every helm upgrade. Only do this for throwaway test servers.
persistence:
  # Global defaults for all PVCs
  storageClassName: nfs-client
  accessMode: ReadWriteOnce
  size: 10Gi

  # World data storage
  world:
    enabled: true
    storageClassName: ""  # Uses global default if empty
    accessModes: []       # Uses global default if empty
    size: ""             # Uses global default if empty
    annotations: {}
    selector: {}
    volumeName: ""

  # Config storage
  config:
    enabled: true
    storageClassName: ""
    accessModes: []
    size: ""
    annotations: {}
    selector: {}
    volumeName: ""

  # Logs storage
  logs:
    enabled: true
    storageClassName: ""
    accessModes: []
    size: ""
    annotations: {}
    selector: {}
    volumeName: ""

# How the server is reachable. Terraria speaks raw TCP on one port, so a regular HTTP
# Ingress does not apply. Pick one:
#   - service.type: LoadBalancer  -> cloud / MetalLB assigns an external IP
#   - service.type: NodePort      -> reachable on every node at service.nodePort
#   - service.type: ClusterIP     -> pair with ingress.traefik or your own objects in extraObjects
service:
  type: ClusterIP
  port: 7777
  targetPort: 7777
  # Fixed node port when type is NodePort (30000-32767). Leave empty for a random one.
  nodePort: ""
  # e.g. metallb.io/loadBalancerIPs or cloud provider annotations
  annotations: {}
  # Optional static IP for type LoadBalancer
  loadBalancerIP: ""
  externalTrafficPolicy: ""

ingress:
  # Traefik IngressRouteTCP on a dedicated TCP entrypoint (Traefik must define it).
  # Off by default; without an ingress controller use service.type LoadBalancer or NodePort.
  traefik:
    enabled: false
    entryPoint: terraria
    port: 7777

# Additional Kubernetes objects rendered as-is (templating with {{ }} is supported), for
# ingress controllers or anything else this chart does not model. Entries may be YAML
# objects or multi-line strings. Example for ingress-nginx TCP passthrough:
#
# extraObjects:
#   - apiVersion: v1
#     kind: ConfigMap
#     metadata:
#       name: tcp-services
#       namespace: ingress-nginx
#     data:
#       "7777": "{{ .Release.Namespace }}/{{ include \"terraria-server.fullname\" . }}:7777"
extraObjects: []

resources:
  limits:
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 2Gi

# Security Context - the image runs as user terraria (uid/gid 999)
podSecurityContext:
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsUser: 999
  runAsNonRoot: true

nodeSelector: {}

tolerations: []

affinity: {}
