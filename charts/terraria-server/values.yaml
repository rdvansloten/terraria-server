# Default values for terraria-server
image:
  repository: docker.io/rdvansloten/terraria-server
  tag: "1458"
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Terraria server configuration
terraria:
  # World name
  world: "Terraria.wld"
  # Server password (leave empty for no password)
  password: ""
  # Max players
  maxPlayers: 10
  # Server port
  port: 7777
  # Difficulty (0=Classic, 1=Expert, 2=Master, 3=Journey)
  difficulty: 0
  # Generate world if it doesn't exist
  autocreate: 2
  # World seed (optional)
  seed: ""

# Storage for world data, config, and logs
persistence:
  # Global defaults for all PVCs
  storageClassName: nfs-client
  accessMode: ReadWriteOnce
  size: 10Gi

  # World data storage
  world:
    enabled: true
    storageClassName: ""  # Uses global default if empty
    accessModes: []       # Uses global default if empty
    size: ""             # Uses global default if empty
    annotations: {}
    selector: {}
    volumeName: ""

  # Config storage
  config:
    enabled: true
    storageClassName: ""
    accessModes: []
    size: ""
    annotations: {}
    selector: {}
    volumeName: ""

  # Logs storage
  logs:
    enabled: true
    storageClassName: ""
    accessModes: []
    size: ""
    annotations: {}
    selector: {}
    volumeName: ""

service:
  type: ClusterIP
  port: 7777
  targetPort: 7777

# Exposing the server outside the cluster.
# Terraria speaks raw TCP, so a regular HTTP Ingress does not apply. Options:
#   - service.type: LoadBalancer or NodePort (works everywhere, no ingress controller needed)
#   - ingress.traefik: Traefik IngressRouteTCP on a dedicated TCP entrypoint
#   - ingress.nginx: ingress-nginx TCP passthrough via its tcp-services ConfigMap
ingress:
  traefik:
    # Create a Traefik IngressRouteTCP
    enabled: true
    entryPoint: terraria
    port: 7777

  nginx:
    # Create the tcp-services ConfigMap used by ingress-nginx to expose TCP ports.
    # The controller must run with --tcp-services-configmap=<namespace>/<name> and its
    # Service must publish externalPort. If the ConfigMap already exists (e.g. managed by the
    # ingress-nginx chart), leave this disabled and add the entry there instead:
    #   data:
    #     "7777": "<release namespace>/<release fullname>:7777"
    enabled: false
    configMapName: tcp-services
    namespace: ingress-nginx
    # Port exposed on the ingress-nginx controller
    externalPort: 7777
    # Enable PROXY protocol towards the server (Terraria does not understand it; keep false)
    proxyProtocol: false


resources:
  limits:
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 2Gi

# Security Context - the image runs as user terraria (uid/gid 999)
podSecurityContext:
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsUser: 999
  runAsNonRoot: true

nodeSelector: {}

tolerations: []

affinity: {}
