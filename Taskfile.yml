version: '3'

vars:
  IMAGE_REPO: docker.io/rdvansloten/terraria-server
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
  VANILLA_IMAGE: terraria-server:vanilla
  TSHOCK_IMAGE: terraria-server:tshock
  VANILLA_VERSION:
    sh: sed -nE 's/^ARG TERRARIA_SERVER_VERSION="([0-9]+)"/\1/p' images/vanilla/Dockerfile
  VANILLA_DOTTED:
    sh: sed -nE 's/^ARG TERRARIA_SERVER_VERSION="([0-9]+)"/\1/p' images/vanilla/Dockerfile | sed 's/./&./g; s/\.$//'
  TSHOCK_VERSION:
    sh: sed -nE 's/^ARG TSHOCK_VERSION="v?([0-9.]+)"/\1/p' images/tshock/Dockerfile
  # Optional: PLATFORM=linux/amd64 to build/test a non-native platform
  PLATFORM_FLAG: '{{if .PLATFORM}}--platform {{.PLATFORM}}{{end}}'

tasks:
  default:
    cmds:
      - task --list

  install:
    desc: Install Python test dependencies into the mise-managed virtualenv
    cmds:
      - uv pip install --quiet -r tests/requirements.txt
    status:
      - python -c "import pytest"

  build:vanilla:
    desc: Build the vanilla Terraria image ({{.VANILLA_IMAGE}})
    cmds:
      - docker buildx build {{.PLATFORM_FLAG}} --load -t {{.VANILLA_IMAGE}} ./images/vanilla
    sources:
      - images/vanilla/**/*

  build:tshock:
    desc: Build the TShock image ({{.TSHOCK_IMAGE}})
    cmds:
      - docker buildx build {{.PLATFORM_FLAG}} --load -t {{.TSHOCK_IMAGE}} ./images/tshock
    sources:
      - images/tshock/**/*

  build:
    desc: Build both images
    deps: ["build:vanilla", "build:tshock"]

  test:vanilla:
    desc: Build and test the vanilla image
    deps: ["install", "build:vanilla"]
    cmds:
      - pytest tests --image {{.VANILLA_IMAGE}} --flavor vanilla {{.PLATFORM_FLAG}} {{.CLI_ARGS}}

  test:tshock:
    desc: Build and test the TShock image
    deps: ["install", "build:tshock"]
    cmds:
      - pytest tests --image {{.TSHOCK_IMAGE}} --flavor tshock {{.PLATFORM_FLAG}} {{.CLI_ARGS}}

  test:
    desc: Build and test both images
    cmds:
      - task: test:vanilla
      - task: test:tshock

  publish:vanilla:
    desc: Build multi-arch vanilla image and push to {{.IMAGE_REPO}} (version, dotted, -vanilla, vanilla, latest)
    cmds:
      - >-
        docker buildx build --platform {{.PLATFORMS}} --push
        -t {{.IMAGE_REPO}}:{{.VANILLA_VERSION}}
        -t {{.IMAGE_REPO}}:{{.VANILLA_DOTTED}}
        -t {{.IMAGE_REPO}}:{{.VANILLA_VERSION}}-vanilla
        -t {{.IMAGE_REPO}}:{{.VANILLA_DOTTED}}-vanilla
        -t {{.IMAGE_REPO}}:vanilla
        -t {{.IMAGE_REPO}}:latest
        ./images/vanilla

  publish:tshock:
    desc: Build multi-arch TShock image and push to {{.IMAGE_REPO}} as {{.TSHOCK_VERSION}}-tshock and tshock (CI also adds the Terraria version tags)
    cmds:
      - >-
        docker buildx build --platform {{.PLATFORMS}} --push
        -t {{.IMAGE_REPO}}:{{.TSHOCK_VERSION}}-tshock
        -t {{.IMAGE_REPO}}:tshock
        ./images/tshock

  lint:chart:
    desc: Lint the Helm chart
    cmds:
      - helm lint charts/terraria-server
