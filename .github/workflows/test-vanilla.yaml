name: Test Vanilla Image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'vanilla/**'
      - 'tests/**'

jobs:
  test:
    name: Test ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm/v7, linux/arm64]
        include:
          - platform: linux/amd64
            tag: vanilla-amd64
            scope: amd64
          - platform: linux/arm/v7
            tag: vanilla-armv7
            scope: armv7
          - platform: linux/arm64
            tag: vanilla-arm64
            scope: arm64

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Build image for ${{ matrix.platform }}
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: ./vanilla
        file: vanilla/Dockerfile
        platforms: ${{ matrix.platform }}
        push: false
        load: true
        tags: |
          terraria-server:${{ matrix.tag }}
        cache-from: type=gha,scope=${{ matrix.scope }}
        cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: tests/requirements.txt

    - name: Install test dependencies
      run: pip install -r tests/requirements.txt

    - name: Test ${{ matrix.platform }}
      run: pytest tests --image terraria-server:${{ matrix.tag }} --flavor vanilla --platform ${{ matrix.platform }}