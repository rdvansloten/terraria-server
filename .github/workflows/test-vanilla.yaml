name: Test Vanilla Image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'vanilla/**'
      - 'tests/**'

jobs:
  test:
    name: Test ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm/v7, linux/arm64]
        include:
          - platform: linux/amd64
            tag: vanilla-amd64
            scope: amd64
          - platform: linux/arm/v7
            tag: vanilla-armv7
            scope: armv7
          - platform: linux/arm64
            tag: vanilla-arm64
            scope: arm64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image for ${{ matrix.platform }}
      uses: docker/build-push-action@v6
      with:
        context: ./vanilla
        file: vanilla/Dockerfile
        platforms: ${{ matrix.platform }}
        push: false
        load: true
        tags: |
          terraria-server:${{ matrix.tag }}
        cache-from: type=gha,scope=${{ matrix.scope }}
        cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: tests/requirements.txt

    - name: Install test dependencies
      run: pip install -r tests/requirements.txt

    - name: Test ${{ matrix.platform }}
      run: pytest tests --image terraria-server:${{ matrix.tag }} --flavor vanilla --platform ${{ matrix.platform }}