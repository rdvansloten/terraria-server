name: Auto-update Vanilla Image

# Runs daily: checks terraria.org for a new dedicated server release, and if the
# version is not yet on Docker Hub, tests it, builds a multi-arch image, pushes it,
# and commits the version bump to the Dockerfile.
#
# Also runs on pushes to main that touch vanilla/ (e.g. merged Renovate PRs for the
# base image), in which case it rebuilds and re-pushes the version currently in the Dockerfile.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and push even if the version already exists on Docker Hub
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'vanilla/**'

permissions:
  contents: write

env:
  IMAGE: rdvansloten/terraria-server
  SERVER_LIST_URL: https://terraria.org/api/get/dedicated-servers-names
  SERVER_DOWNLOAD_URL: https://terraria.org/api/download/pc-dedicated-server

jobs:
  check:
    name: Check for new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      dotted: ${{ steps.check.outputs.dotted }}
      build: ${{ steps.check.outputs.build }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Determine version and whether to build
      id: check
      run: |
        set -euo pipefail

        current=$(sed -nE 's/^ARG TERRARIA_SERVER_VERSION="([0-9]+)"/\1/p' vanilla/Dockerfile)
        echo "Dockerfile version : $current"

        latest=$(curl -fsSL "$SERVER_LIST_URL" \
          | grep -oE 'terraria-server-[0-9]+\.zip' | grep -oE '[0-9]+' | sort -n | tail -1)
        echo "terraria.org latest: $latest"
        if [ -z "$latest" ]; then
          echo "::error::Could not determine latest version from $SERVER_LIST_URL"
          exit 1
        fi

        # On push events (merged Dockerfile changes), rebuild whatever the Dockerfile says.
        # Otherwise follow the latest release from terraria.org.
        if [ "${{ github.event_name }}" = "push" ]; then
          version=$current
        else
          version=$latest
        fi

        # Make sure the zip actually exists before doing anything else
        curl -fsSIL -o /dev/null "${SERVER_DOWNLOAD_URL}/terraria-server-${version}.zip"

        if curl -fsL -o /dev/null "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${version}"; then
          on_hub=true
        else
          on_hub=false
        fi
        echo "Tag ${version} on Docker Hub: $on_hub"

        build=false
        if [ "$on_hub" = false ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ]; then
          build=true
        fi

        dotted=$(echo "$version" | sed 's/./&./g; s/\.$//')

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "dotted=$dotted"   >> "$GITHUB_OUTPUT"
        echo "build=$build"     >> "$GITHUB_OUTPUT"
        echo "Build: $build (version $version / $dotted)"

  test:
    name: Test ${{ matrix.platform }}
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm/v7, linux/arm64]
        include:
          - platform: linux/amd64
            tag: vanilla-amd64
          - platform: linux/arm/v7
            tag: vanilla-armv7
          - platform: linux/arm64
            tag: vanilla-arm64

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Build image for ${{ matrix.platform }}
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: ./vanilla
        file: vanilla/Dockerfile
        platforms: ${{ matrix.platform }}
        build-args: TERRARIA_SERVER_VERSION=${{ needs.check.outputs.version }}
        push: false
        load: true
        tags: terraria-server:${{ matrix.tag }}

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: tests/requirements.txt

    - name: Install test dependencies
      run: pip install -r tests/requirements.txt

    - name: Test ${{ matrix.platform }}
      run: pytest tests --image terraria-server:${{ matrix.tag }} --flavor vanilla --platform ${{ matrix.platform }}
  publish:
    name: Build, push and commit
    needs: [check, test]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Bump version in Dockerfile
      run: |
        sed -i -E 's/^ARG TERRARIA_SERVER_VERSION="[0-9]+"/ARG TERRARIA_SERVER_VERSION="${{ needs.check.outputs.version }}"/' vanilla/Dockerfile
        head -1 vanilla/Dockerfile

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      with:
        platforms: linux/amd64,linux/arm/v7,linux/arm64

    - name: Log in to Docker Hub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push multi-arch image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: ./vanilla
        file: vanilla/Dockerfile
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE }}:${{ needs.check.outputs.version }}
          ${{ env.IMAGE }}:${{ needs.check.outputs.dotted }}
          ${{ env.IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Commit version bump
      if: github.event_name != 'push'
      run: |
        if git diff --quiet vanilla/Dockerfile; then
          echo "Dockerfile already at ${{ needs.check.outputs.version }}, nothing to commit"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add vanilla/Dockerfile
        git commit -m "Bump Terraria server to ${{ needs.check.outputs.dotted }}"
        git push

    - name: Logout from Docker Hub
      if: always()
      run: docker logout
