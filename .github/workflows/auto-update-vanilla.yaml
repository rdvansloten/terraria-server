name: Auto-update Vanilla Image

# Runs daily: checks terraria.org for a new dedicated server release. If that version is
# not yet on Docker Hub, it builds, tests and pushes it through build-vanilla.yaml and then
# commits the version bump to the Dockerfile.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and push even if the version already exists on Docker Hub
        type: boolean
        default: false
permissions:
  contents: write

env:
  IMAGE: rdvansloten/terraria-server
  SERVER_LIST_URL: https://terraria.org/api/get/dedicated-servers-names
  SERVER_DOWNLOAD_URL: https://terraria.org/api/download/pc-dedicated-server

jobs:
  check:
    name: Check for new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      dotted: ${{ steps.check.outputs.dotted }}
      build: ${{ steps.check.outputs.build }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Determine version and whether to build
      id: check
      run: |
        set -euo pipefail

        current=$(sed -nE 's/^ARG TERRARIA_SERVER_VERSION="([0-9]+)"/\1/p' images/vanilla/Dockerfile)
        echo "Dockerfile version : $current"

        latest=$(curl -fsSL "$SERVER_LIST_URL" \
          | grep -oE 'terraria-server-[0-9]+\.zip' | grep -oE '[0-9]+' | sort -n | tail -1)
        echo "terraria.org latest: $latest"
        if [ -z "$latest" ]; then
          echo "::error::Could not determine latest version from $SERVER_LIST_URL"
          exit 1
        fi

        version=$latest

        # Make sure the zip actually exists before doing anything else
        curl -fsSIL -o /dev/null "${SERVER_DOWNLOAD_URL}/terraria-server-${version}.zip"

        if curl -fsL -o /dev/null "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${version}"; then
          on_hub=true
        else
          on_hub=false
        fi
        echo "Tag ${version} on Docker Hub: $on_hub"

        build=false
        if [ "$on_hub" = false ] || [ "${{ inputs.force }}" = "true" ]; then
          build=true
        fi

        dotted=$(echo "$version" | sed 's/./&./g; s/\.$//')

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "dotted=$dotted"   >> "$GITHUB_OUTPUT"
        echo "build=$build"     >> "$GITHUB_OUTPUT"
        echo "Build: $build (version $version / $dotted)"

  build-test-push:
    name: Build, test and push
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build-vanilla.yaml
    with:
      version: ${{ needs.check.outputs.version }}
    secrets: inherit

  commit:
    name: Commit version bump
    needs: [check, build-test-push]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Bump version in Dockerfile and commit
      run: |
        sed -i -E 's/^ARG TERRARIA_SERVER_VERSION="[0-9]+"/ARG TERRARIA_SERVER_VERSION="${{ needs.check.outputs.version }}"/' images/vanilla/Dockerfile
        if git diff --quiet images/vanilla/Dockerfile; then
          echo "Dockerfile already at ${{ needs.check.outputs.version }}, nothing to commit"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add images/vanilla/Dockerfile
        git commit -m "Bump Terraria server to ${{ needs.check.outputs.dotted }}"
        git push
