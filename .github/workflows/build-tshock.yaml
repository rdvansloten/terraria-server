name: Build TShock image

# Builds the multi-arch image once into a throwaway registry on the runner, tests every
# platform from it with the pytest suite, and only pushes the tested manifest to Docker Hub
# on main. TShock version bumps arrive as Renovate pull requests.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - images/tshock/**
      - tests/**
      - .github/workflows/build-tshock.yaml
  push:
    branches:
      - main
    paths:
      - images/tshock/**
      - tests/**
      - .github/workflows/build-tshock.yaml

env:
  REGISTRY: docker.io
  REPOSITORY: rdvansloten/terraria-server
  BUILD_REGISTRY: localhost:5000
  # renovate: datasource=docker depName=library/registry
  BUILD_REGISTRY_VERSION: 3.1.1
  BUILD_CONTEXT: images/tshock
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
  FLAVOR: tshock
  VERSION_ARG: TSHOCK_VERSION

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout self
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the version from the Dockerfile
        id: version
        run: |
          version="$(awk -F= -v arg="ARG $VERSION_ARG" '$1 == arg { gsub(/"/, "", $2); print $2; exit }' "$BUILD_CONTEXT/Dockerfile")"
          test -n "$version" || { echo "::error::could not read ARG $VERSION_ARG from $BUILD_CONTEXT/Dockerfile"; exit 1; }
          # v6.1.0 -> 6.1.0
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "Building TShock ${version#v}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Start the build registry
        run: |
          docker run --detach \
            --name build-registry \
            --publish 5000:5000 \
            "docker.io/library/registry:$BUILD_REGISTRY_VERSION"
          until curl --silent --fail "http://$BUILD_REGISTRY/v2/" >/dev/null; do sleep 1; done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host
          buildkitd-config-inline: |
            [registry."${{ env.BUILD_REGISTRY }}"]
              http = true

      - name: Build all platforms into the build registry
        run: |
          docker buildx build "$BUILD_CONTEXT" \
            --pull \
            --network host \
            --platform "$PLATFORMS" \
            --tag "$BUILD_REGISTRY/$REPOSITORY:candidate" \
            --push

      - name: Test on linux/amd64
        run: |
          docker pull --platform linux/amd64 "$BUILD_REGISTRY/$REPOSITORY:candidate"
          pytest tests --image "$BUILD_REGISTRY/$REPOSITORY:candidate" --flavor "$FLAVOR" --platform linux/amd64

      - name: Test on linux/arm64
        run: |
          docker pull --platform linux/arm64 "$BUILD_REGISTRY/$REPOSITORY:candidate"
          pytest tests --image "$BUILD_REGISTRY/$REPOSITORY:candidate" --flavor "$FLAVOR" --platform linux/arm64

      - name: Test on linux/arm/v7
        run: |
          docker pull --platform linux/arm/v7 "$BUILD_REGISTRY/$REPOSITORY:candidate"
          pytest tests --image "$BUILD_REGISTRY/$REPOSITORY:candidate" --flavor "$FLAVOR" --platform linux/arm/v7

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push the tested image
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |-
          docker buildx imagetools create \
            --tag "$REGISTRY/$REPOSITORY:tshock-$VERSION" \
            --tag "$REGISTRY/$REPOSITORY:tshock-latest" \
            "$BUILD_REGISTRY/$REPOSITORY:candidate"
          echo "Pushed \`$REGISTRY/$REPOSITORY:tshock-$VERSION\` and \`:tshock-latest\`" >> "$GITHUB_STEP_SUMMARY"
